# Custom dist publish job: publishes the `gameday` crate to crates.io.
#
# Wired in via dist-workspace.toml's `publish-jobs = ["homebrew", "./publish-crate"]`.
# `dist generate --mode ci` reads that and adds a `custom-publish-crate` job
# to release.yml that calls this reusable workflow after `host` succeeds,
# already gated on `!announcement_is_prerelease || publish_prereleases`
# (an `-rc.N` tag is a semver prerelease, so it's skipped there too). The
# `if` below is redundant with that gate but states the rc/non-rc rule
# explicitly, matching the release procedure in docs/dev.md.
name: publish-crate

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crate:
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.ref, '-rc') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
