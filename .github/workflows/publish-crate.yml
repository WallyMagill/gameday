# Custom dist publish job: publishes the `gameday` crate to crates.io.
#
# Wired in via dist-workspace.toml's `publish-jobs = ["homebrew", "./publish-crate"]`.
# `dist generate --mode ci` reads that and adds a `custom-publish-crate` job
# to release.yml that calls this reusable workflow after `host` succeeds,
# already gated on `!announcement_is_prerelease || publish_prereleases`
# (an `-rc.N` tag is a semver prerelease, so it's skipped there too). The
# `if` below is redundant with that gate but states the `-rc` rule
# explicitly, matching the release procedure in docs/dev.md (other prerelease
# spellings, `-beta.N` say, rely on dist's gate alone).
name: publish-crate

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

# Empty on purpose. The caller (release.yml's custom-publish-crate) grants
# only `id-token: write` and `packages: write`, and a called workflow may not
# request a scope the caller left at `none`: asking for `contents: read` here
# failed the whole Release workflow at startup (run 34249642237, the first rc
# tag). `{}` asks for nothing, so it can't exceed the caller, and drops the two
# scopes this job never uses: checkout of a public repo needs no scope, and
# `cargo publish` authenticates with CARGO_REGISTRY_TOKEN, not OIDC.
permissions: {}

jobs:
  publish-crate:
    runs-on: ubuntu-22.04
    if: ${{ !contains(github.ref, '-rc') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
