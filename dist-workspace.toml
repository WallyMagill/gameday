[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "WallyMagill/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-crate"]
# Prereleases publish too: an rc must exercise the tap (crates.io stays off for -rc via publish-crate.yml's own guard)
publish-prereleases = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# release.yml is hand-edited: its actions are pinned to commit SHAs. Without
# this, `dist plan` fails the Release workflow on the edited file. After a dist
# upgrade: drop this line, `dist generate --mode ci`, re-pin, restore it.
allow-dirty = ["ci"]

# dist 0.32.0 builds aarch64-apple-darwin on `macos-14`, which GitHub retired
# on 2026-11-02: the v1.1.0 Release run of 2026-11-16 cancelled that job with
# "The configuration 'macos-14-arm64-us-default' is not supported" and
# published nothing. `macos-15` is the image the x86_64-apple-darwin job
# already runs on (`macos-15-intel`). Drop this once a dist upgrade defaults
# to a supported image.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
