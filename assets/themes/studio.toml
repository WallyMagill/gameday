# studio — the broadcast palette at discipline level 3: only scores, logos,
# the league chips and LIVE/scoring red stay colored. Everything else is gray.
name = "studio"

[palette]
bg = "#000000"
fg = "#c8c8c8"
bright = "#ebebeb"
muted = "#787878"
dim = "#3c3c3c"
border = "#505050"
live = "#ff3c3c"
green = "#50d26e"
cyan = "#46c8dc"
magenta = "#dc64dc"
star = "#f0c846"

[palette.league]
nfl = "#ff4646"
cfb = "#ff963c"
nba = "#508cff"
wnba = "#6eb4ff"
cbb = "#7878ff"
mlb = "#e6c83c"
nhl = "#46c8dc"
epl = "#5ad282"
mls = "#3cc8b4"

[discipline]
chips = true
section_labels = false
play_abbrs = false
clocks = false
sidebar_headers = "muted"
