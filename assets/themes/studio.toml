# studio — the broadcast palette, calm. Same ground, same red; the difference
# is in the ROLES: row scores are white instead of amber, and the section
# structure recedes to `dim`. What is left in color is the hero and the live
# mark, which is the identity floor. (Before v3.2 studio differed from
# broadcast only in `[discipline]`, so at the role layer the two were the same
# theme — this is what makes them two looks.)
name = "studio"

[palette]
bg = "#000000"
fg = "#c8c8c8"
bright = "#ebebeb"
muted = "#787878"
dim = "#3c3c3c"
border = "#505050"
live = "#ff3c3c"
green = "#50d26e"
cyan = "#46c8dc"
magenta = "#dc64dc"
star = "#f0c846"

[palette.league]
nfl = "#ff4646"
cfb = "#ff963c"
nba = "#508cff"
wnba = "#6eb4ff"
cbb = "#7878ff"
mlb = "#e6c83c"
nhl = "#46c8dc"
epl = "#5ad282"
mls = "#3cc8b4"

# The calm mapping: white row scores (`bright`, not the amber `star`) and a
# section structure one step back (`dim`, not `border`). `hot` stays `live` —
# red is the identity floor no theme is allowed to spend.
[roles]
ground = "bg"
ink = "fg"
dim = "muted"
digits = "bright"
hot = "live"
cool = "dim"
team = "hero"

[discipline]
chips = true
section_labels = false
play_abbrs = false
clocks = false
sidebar_headers = "muted"
