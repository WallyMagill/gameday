[package]
name = "gameday"
version = "0.1.0"
edition = "2021"
# Floor: the dependency graph's own rust-version fields (ratatui 0.30 and its
# workspace, via darling/time, need 1.88); higher than the 1.87 floor from
# `u64::is_multiple_of`. Verified by the CI `msrv` job.
rust-version = "1.88"
description = "Terminal sports board: the game worth watching is at the top. Nine leagues, no account, one binary."
license = "MIT OR Apache-2.0"
repository = "https://github.com/WallyMagill/gameday"
readme = "README.md"
keywords = ["sports", "tui", "terminal", "scores", "espn"]
categories = ["command-line-utilities"]
# Everything the binary embeds stays in (assets/, fixtures/nfl_standings.json
# via src/dump.rs). Docs, research, tooling and captures stay out.
exclude = [
    "docs/",
    "fixtures/replay/",
    "scripts/",
    "tools/",
    ".github/",
    "*.tape",
    ".git-blame-ignore-revs",
]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset", "macros"] }
dirs = "7"
tui-big-text = "0.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
