[package]
name = "gameday"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset", "macros"] }
dirs = "7"
tui-big-text = "0.8"
